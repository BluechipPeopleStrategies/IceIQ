<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title>Gold trailer open high in the slot</title>
  <desc>Gold attacks bottom to top. The puck carrier is near the left boards, the middle drive pulls coverage low, and the trailing gold forward is open high in the slot.</desc>
  <defs>
    <style>
      .ice{fill:#f7fbff;stroke:#9cc7df;stroke-width:8}
      .line-red{stroke:#d84b4b;stroke-width:5}
      .line-blue{stroke:#4f8fd8;stroke-width:6}
      .circle{fill:none;stroke:#c7dcea;stroke-width:4}
      .gold{fill:#d6a300;stroke:#7b5a00;stroke-width:5}
      .white{fill:#ffffff;stroke:#6f7d88;stroke-width:5}
      .stick{stroke:#2d3740;stroke-width:6;stroke-linecap:round}
      .puck{fill:#111827}
      .net{fill:none;stroke:#c92f2f;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .crease{fill:#d9f0ff;stroke:#65a9d9;stroke-width:4;opacity:.9}
    </style>
  </defs>
  <rect class="ice" x="40" y="50" width="1120" height="700" rx="110"/>
  <line class="line-red" x1="80" y1="400" x2="1120" y2="400"/>
  <line class="line-blue" x1="75" y1="275" x2="1125" y2="275"/>
  <line class="line-blue" x1="75" y1="610" x2="1125" y2="610"/>
  <line class="line-red" x1="360" y1="108" x2="840" y2="108"/>
  <circle class="circle" cx="255" cy="220" r="70"/>
  <circle class="circle" cx="945" cy="220" r="70"/>
  <circle class="circle" cx="255" cy="580" r="70"/>
  <circle class="circle" cx="945" cy="580" r="70"/>
  <path class="crease" d="M515 118 C540 185 660 185 685 118 Z"/>
  <path class="net" d="M540 72 L660 72 M540 72 L560 35 M660 72 L640 35 M560 35 L640 35"/>
  <g transform="translate(600 120)">
    <ellipse class="white" cx="0" cy="0" rx="42" ry="28"/>
    <line class="stick" x1="-16" y1="18" x2="-50" y2="54"/>
  </g>
  <g transform="translate(245 520)">
    <circle class="gold" cx="0" cy="0" r="34"/>
    <line class="stick" x1="18" y1="-24" x2="56" y2="-62"/>
    <circle class="puck" cx="64" cy="-69" r="9"/>
  </g>
  <g transform="translate(575 245)">
    <circle class="gold" cx="0" cy="0" r="32"/>
    <line class="stick" x1="18" y1="-20" x2="42" y2="-56"/>
  </g>
  <g transform="translate(615 430)">
    <circle class="gold" cx="0" cy="0" r="34"/>
    <line class="stick" x1="16" y1="-22" x2="44" y2="-60"/>
  </g>
  <g transform="translate(545 210)">
    <circle class="white" cx="0" cy="0" r="34"/>
    <line class="stick" x1="-20" y1="20" x2="-52" y2="60"/>
  </g>
  <g transform="translate(345 455)">
    <circle class="white" cx="0" cy="0" r="34"/>
    <line class="stick" x1="-22" y1="-20" x2="-72" y2="-58"/>
  </g>
</svg>
