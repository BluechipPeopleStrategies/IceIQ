<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title>Gold puck carrier has cushion on a rush</title>
  <desc>Gold attacks left to right. The white defender is backed deep into the slot, leaving open ice for the puck carrier to carry forward.</desc>
  <defs>
    <style>
      .ice{fill:#f7fbff;stroke:#9cc7df;stroke-width:8}
      .line-red{stroke:#d84b4b;stroke-width:5}
      .line-blue{stroke:#4f8fd8;stroke-width:6}
      .circle{fill:none;stroke:#c7dcea;stroke-width:4}
      .gold{fill:#d6a300;stroke:#7b5a00;stroke-width:5}
      .white{fill:#ffffff;stroke:#6f7d88;stroke-width:5}
      .stick{stroke:#2d3740;stroke-width:6;stroke-linecap:round}
      .puck{fill:#111827}
      .net{fill:none;stroke:#c92f2f;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .crease{fill:#d9f0ff;stroke:#65a9d9;stroke-width:4;opacity:.9}
    </style>
  </defs>
  <rect class="ice" x="40" y="50" width="1120" height="700" rx="110"/>
  <line class="line-red" x1="600" y1="55" x2="600" y2="745"/>
  <line class="line-blue" x1="365" y1="70" x2="365" y2="730"/>
  <line class="line-blue" x1="835" y1="70" x2="835" y2="730"/>
  <line class="line-red" x1="1055" y1="150" x2="1055" y2="650"/>
  <circle class="circle" cx="290" cy="245" r="78"/>
  <circle class="circle" cx="290" cy="555" r="78"/>
  <circle class="circle" cx="930" cy="245" r="78"/>
  <circle class="circle" cx="930" cy="555" r="78"/>
  <path class="crease" d="M1047 315 C975 335 975 465 1047 485 Z"/>
  <path class="net" d="M1093 345 L1093 455 M1093 345 L1135 365 M1093 455 L1135 435 M1135 365 L1135 435"/>
  <g transform="translate(1055 400)">
    <ellipse class="white" cx="0" cy="0" rx="28" ry="42"/>
    <line class="stick" x1="-20" y1="14" x2="-55" y2="34"/>
  </g>
  <g transform="translate(345 560)">
    <circle class="gold" cx="0" cy="0" r="34"/>
    <line class="stick" x1="25" y1="-14" x2="72" y2="-28"/>
    <circle class="puck" cx="82" cy="-31" r="9"/>
  </g>
  <g transform="translate(380 260)">
    <circle class="gold" cx="0" cy="0" r="32"/>
    <line class="stick" x1="24" y1="14" x2="68" y2="34"/>
  </g>
  <g transform="translate(780 405)">
    <circle class="white" cx="0" cy="0" r="36"/>
    <line class="stick" x1="-24" y1="16" x2="-70" y2="44"/>
  </g>
</svg>
