<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Gold puck carrier has cushion on a rush</title>
  <desc id="desc">Gold attacks left to right. The white defender is backed deep into the slot, leaving open ice for the puck carrier to carry forward.</desc>
