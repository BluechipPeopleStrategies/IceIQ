name: Supabase keepalive

# Supabase pauses free-tier projects after 7 days of inactivity. A paused
# project stops resolving in DNS entirely, which means:
#
#   1. ice-iq.vercel.app cannot authenticate anyone. The live app is DOWN.
#   2. "Reset demo accounts" dies with `getaddrinfo ENOTFOUND` in ~14s.
#
# That second symptom is what surfaced this: the Monday reset failed on
# 2026-06-22, 06-29, 07-06 and 07-20 with an identical ENOTFOUND, and passed
# only in weeks with active development keeping the project warm. The failing
# cron was an outage alarm nobody was reading.
#
# This job touches the database every 3 days so the 7-day idle clock never
# runs out. It does NOT paper over a real outage: if the project is already
# paused, DNS fails here too and this job goes red with an actionable message.
# A ping cannot wake a paused project — that needs a manual restore.
#
# Uses the two repo secrets the reset workflow already relies on:
#   VITE_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#
# The anon key would be preferable (it ships in the client bundle anyway), but
# it is not a repo secret, and as of 2026-08-03 the value in the local .env
# returns 401 against this project.

on:
  schedule:
    # 05:00 UTC every 3rd day of the month: 1,4,7,...,28,31.
    # Longest possible gap is 3 days, comfortably inside the 7-day window.
    - cron: "0 5 */3 * *"
  workflow_dispatch:

# No repo access needed — this only talks to Supabase.
permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Touch the database
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::VITE_SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not set."
            echo "Set both under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # A real table read, not just the PostgREST root, so the request
          # genuinely reaches Postgres and counts as project activity.
          if ! out=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                       -H "apikey: $KEY" \
                       -H "Authorization: Bearer $KEY" \
                       "$URL/rest/v1/profiles?select=id&limit=1" 2>&1); then
            echo "::error::Supabase is unreachable — the project is almost certainly PAUSED."
            echo "curl: $out"
            echo ""
            echo "A keepalive ping CANNOT wake a paused project. Restore it by hand:"
            echo "  Supabase Dashboard → the RinkReads project → Restore"
            echo ""
            echo "While it is paused, ice-iq.vercel.app cannot log anyone in."
            exit 1
          fi

          echo "Supabase responded HTTP $out"
          case "$out" in
            2*|3*)
              echo "Project is awake. The 7-day idle clock is reset."
              ;;
            401|403)
              echo "::error::Reached Supabase but auth was rejected (HTTP $out)."
              echo "SUPABASE_SERVICE_ROLE_KEY has probably been rotated. Update the repo secret."
              exit 1
              ;;
            *)
              echo "::error::Unexpected status HTTP $out from $URL"
              exit 1
              ;;
          esac
