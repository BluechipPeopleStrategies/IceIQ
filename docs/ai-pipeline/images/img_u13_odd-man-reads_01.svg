<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title>Gold odd-man rush with shot lane open</title>
  <desc>Gold attacks right to left. The white defender blocks the pass to the middle teammate while the puck carrier has a clear lane to the net.</desc>
  <defs>
    <linearGradient id="ice-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff" />
      <stop offset="0.52" stop-color="#eef8ff" />
      <stop offset="1" stop-color="#f8fcff" />
    </linearGradient>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <style>
      .ice{fill:url(#ice-sheen);stroke:#6fb5d2;stroke-width:10}
      .line-red{stroke:#d8212a;stroke-width:5;opacity:.74}
      .line-blue{stroke:#2467d8;stroke-width:11;opacity:.62}
      .circle{fill:none;stroke:#d8212a;stroke-width:4;opacity:.28}
      .faceoff-dot{fill:#d8212a;opacity:.58}
      .gold{fill:#c9a24b;stroke:#7c5a12;stroke-width:5}
      .white{fill:#f8fafc;stroke:#64748b;stroke-width:5}
      .stick{stroke:#233044;stroke-width:6;stroke-linecap:round}
      .puck{fill:#050505}
      .net{fill:none;stroke:#d8212a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .crease{fill:#d9f0ff;stroke:#5ba4e8;stroke-width:4;opacity:.82}
    </style>
  </defs>
